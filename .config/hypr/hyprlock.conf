###############
### PRELOAD ###
###############

source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d " # update every 60 seconds
    font_size = 26
    font_family = $font
    color = $on_primary_container 
    position = 0, -350
    halign = center
    valign = top
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 128
    font_family = $font
    color = $on_primary_container
    position = 0, -120
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 18%, 7%
    outline_thickness = 2
    inner_color = $background
    outer_color = $primary $secondary 45deg

    capslock_color = $background
    check_color = $secondary $tertiary 45deg
    fail_color =  $error_container $on_error 270deg

    font_color = $on_background
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3
    position = 0, 0
    halign = center
    valign = center
}



