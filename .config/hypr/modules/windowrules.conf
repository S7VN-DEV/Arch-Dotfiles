##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Windowrules for screenshare
windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge
    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

# Windowrule to add apps/games to run at 60fps in other workspaces
windowrule {
    name = steam-games-60fps
    match:class = ^steam_app_\d+$
    render_unfocused = on
}
windowrule {
    name = gamescope-60fps
    match:class = ^gamescope\d+$
    render_unfocused = on
}
windowrule {
    name = exe-60fps
    match:class = ^(nightreign.exe)$
    render_unfocused = on
}

# Extras
windowrule {
  name = waypaper-float
  float = on
  size = 600 500
  center = true
  xray = true
  match:class = ^(waypaper)$
}

windowrule = match:class cs2, immediate yes
windowrule = match:title ELDEN RING NIGHTREIGN, immediate yes
windowrule = match:title HorizonMW v1.6.1, immediate yes
