#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 12
    border_size = 2
    resize_on_border = true
    allow_tearing = true
    layout = dwindle

    col.active_border = $primary $secondary 45deg
    col.inactive_border = $on_primary $on_secondary 45deg
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
	    range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 1
        passes = 1
        vibrancy = 0.4
        vibrancy_darkness = 0
        new_optimizations = true
        ignore_opacity = true
    }
    layerrule = blur off, match:namespace selection
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = quickFill,0.68,0.98,0.02,0.81

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 2.79, quickFill
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 0.6, almostLinear
    animation = fadeOut, 1, 0.73, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2, almostLinear, fade
    animation = workspacesIn, 1, 1.5, easeInOutCubic, slideFade
    animation = workspacesOut, 1, 1.94, easeInOutCubic, slideFade
}
